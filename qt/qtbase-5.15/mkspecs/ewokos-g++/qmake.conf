#
# qmake configuration for building Qt with aarch64-none-elf-g++ for EwokOS.
#
# Used as:
#
#     EWOK_SDK=<repo>/system/build_aarch64/virt \
#     ./configure -xplatform ewokos-g++ -device-option CROSS_COMPILE=aarch64-none-elf- ...
#
# Three decisions in this file are load-bearing and easy to get wrong, so they
# are explained rather than just written down.
#
# 1. common/unix.conf is included, NOT common/linux.conf.  linux.conf does
#    QMAKE_PLATFORM += linux, and configure.json gates a great many features on
#    config.linux - epoll, inotify, /proc parsing, getauxval, statx.  EwokOS has
#    none of those, so claiming linux would switch the features on and then fail
#    to compile them.  QMAKE_PLATFORM is a *qmake* notion anyway: it does not
#    reach the C++ side, where Q_OS_* comes from qsystemdetection.h and the
#    compiler's predefined macros.  That header has been taught about __EWOKOS__
#    (the VxWorks pattern, since a bare -elf toolchain predefines no OS macro)
#    and defines Q_OS_EWOKOS plus Q_OS_UNIX, and deliberately not Q_OS_LINUX.
#    So the variables linux.conf would have provided are set out by hand below.
#
# 2. The compiler flags are make.rule's, from
#    system/platform/aarch64/make.rule, so that Qt is built exactly like the rest
#    of EwokOS and links against it.  -nostdinc++ in particular is what makes
#    EWOK_STL the only C++ standard library in scope, and what makes Qt's
#    __has_include() probes answer honestly - which is how <chrono>, absent here,
#    correctly turns off QDeadlineTimer and QMutex::try_lock_for.
#    -Wall -Wextra -pedantic are dropped.  Qt 5.15's own sources are not clean
#    under GCC 13 at those levels, and .qmake.conf sets CONFIG += warning_clean,
#    which turns every one into an error; -Wno-error below is the belt to that
#    brace.  Nothing about the generated code changes.
#
# 3. Every -std= level is pinned to c++14.  That is make.rule's level and the one
#    EWOK_STL is verified at; if Qt asks for c++11 or c++1z it still gets c++14,
#    so the standard library is never compiled at a level it has not been tested
#    against.  Qt 5.15 needs C++11 and treats anything newer as optional behind
#    __cpp_* feature macros, so this costs nothing.
#

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental staticlib
QMAKE_INCREMENTAL_STYLE = sublib

# The SDK root carries both the headers EWOK_STL installs into and every EwokOS
# archive.  Taken from the environment rather than baked in, because the same
# mkspec has to serve build_aarch64/virt, build_aarch64/raspi5 and build_arm.
EWOK_SDK = $$(EWOK_SDK)
isEmpty(EWOK_SDK) {
    error("EWOK_SDK must point at an EwokOS SDK root, e.g. <repo>/system/build_aarch64/virt")
}

# The cross-compiler prefix, and it has to be a *qmake* variable, not merely an
# environment one.  common/g++-base.conf spells the compilers as
# $${CROSS_COMPILE}gcc and $${CROSS_COMPILE}g++, which expands the qmake variable
# at include time; $$(CROSS_COMPILE) would be the environment.  Qt's -device
# builds get the variable written for them by -device-option, but -xplatform does
# not, so with only an exported environment variable the prefix silently expands
# to nothing and qmake probes the HOST compiler instead - which on a macOS build
# host means Apple clang answering for an aarch64-none-elf target, and the
# "failed to parse default library paths" that follows.  Hence: take it from the
# environment if it was exported there, else fall back to the aarch64 default.
# Must be set BEFORE the includes below, since they expand it.
isEmpty(CROSS_COMPILE): CROSS_COMPILE = $$(CROSS_COMPILE)
isEmpty(CROSS_COMPILE): CROSS_COMPILE = aarch64-none-elf-

# Until the EwokOS QPA plugin exists, 'minimal' is the only platform that can be
# asked for; it needs no windowing system and so lets corelib and gui build.
QT_QPA_DEFAULT_PLATFORM = minimal

QMAKE_PLATFORM         += unix posix ewokos

# One level up, not two: qmake resolves include() relative to this file's own
# directory (mkspecs/ewokos-g++/), so ../common/ is mkspecs/common/.  Writing
# ../../common/ reaches past mkspecs into the Qt root and fails to load, which
# then cascades into "does not announce the compiler family" and "failed to parse
# default library paths" - both symptoms of these three files never being read.
include(../common/unix.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

# ---- the toolchain -------------------------------------------------------
# g++-base.conf already spells these as $${CROSS_COMPILE}gcc and ...g++, so
# CROSS_COMPILE=aarch64-none-elf- on the configure line is enough.  The binutils
# are named explicitly because qmake invokes them directly.
QMAKE_CC                = $${CROSS_COMPILE}gcc
QMAKE_CXX               = $${CROSS_COMPILE}g++
QMAKE_LINK              = $$QMAKE_CXX
QMAKE_LINK_C            = $$QMAKE_CC
QMAKE_AR                = $${CROSS_COMPILE}ar cqs
QMAKE_OBJCOPY           = $${CROSS_COMPILE}objcopy
QMAKE_NM                = $${CROSS_COMPILE}nm -P
QMAKE_RANLIB            = $${CROSS_COMPILE}ranlib
QMAKE_STRIP             = $${CROSS_COMPILE}strip
QMAKE_STRIPFLAGS_LIB   += --strip-unneeded

# ---- what linux.conf would have provided, minus the Linux-only parts ------
QMAKE_CFLAGS_THREAD    += -D_REENTRANT
QMAKE_CXXFLAGS_THREAD  += $$QMAKE_CFLAGS_THREAD

QMAKE_INCDIR            =
QMAKE_LIBDIR            =
QMAKE_INCDIR_X11        =
QMAKE_LIBDIR_X11        =
QMAKE_INCDIR_OPENGL     =
QMAKE_LIBDIR_OPENGL     =
QMAKE_INCDIR_OPENGL_ES2 =
QMAKE_LIBDIR_OPENGL_ES2 =
QMAKE_INCDIR_EGL        =
QMAKE_LIBDIR_EGL        =
QMAKE_INCDIR_OPENVG     =
QMAKE_LIBDIR_OPENVG     =

QMAKE_LIBS              =
# No dlfcn.h on EwokOS and no dlopen in the kernel, so plugins are linked in
# statically.  Anything that would reach for -ldl has to be configured off.
QMAKE_LIBS_DYNLOAD      =
QMAKE_LIBS_X11          =
QMAKE_LIBS_EGL          =
QMAKE_LIBS_OPENGL       =
QMAKE_LIBS_OPENGL_ES2   =
QMAKE_LIBS_OPENVG       =
# pthread lives in libewoksys/libc, which EWOK_LIBC already pulls in as a group;
# there is no separate -lpthread to name.
QMAKE_LIBS_THREAD       =
QMAKE_LIBS_VULKAN       =

# EwokOS's libc is a thin newlib-derived layer: its _read/_write/_open/_sbrk
# stubs call out to vfs_*, proc_*, dev_* and __errno, which live in libewoksys,
# and libewoksys calls back into libc.  The two are mutually recursive, so they
# have to be resolved as a group rather than in a fixed order - which is exactly
# what make.rule already encodes as
#     EWOK_LIBC = --start-group -lewoksys -lc -lgloss --end-group
# Without this, even "can the toolchain compile and link a minimal program"
# fails, and configure stops at "Cannot compile a minimal program".
#
# -lcxx is in the group too.  It carries __cxa_guard_acquire/release/abort,
# __cxa_pure_virtual and operator new/delete, i.e. the support code for
# function-local statics and pure virtual calls.  Qt leans hard on function-local
# statics through Q_GLOBAL_STATIC, and every one of those needs a guard.
EWOK_LIBC = -Wl,--start-group -lewoksys -lc -lgloss -lcxx -Wl,--end-group
QMAKE_LIBS += $$EWOK_LIBC

# EwokOS supplies its own C runtime entry point, so the toolchain's must not be
# linked in.  libewoksys's cmain.o defines _start and libgloss's syscalls.o
# defines _fini, which collide with aarch64-none-elf's crt0.o and crti.o; and
# crt0.o calls __libc_init_array, which nothing on EwokOS provides.  Every
# EwokOS program is linked the same way - projects/*/Makefile all use
#     $(LD) -Ttext=100 $(OBJS) -o $@ ... $(EWOK_LIBC)
# where LD is aarch64-none-elf-ld itself, and plain ld adds no startup files at
# all.  qmake needs a compiler driver rather than the bare linker, so the
# equivalent through g++ is -nostartfiles plus the same text address.
#
# Worth stating plainly what this implies: with no crt0 there is no
# __libc_init_array, so .init_array is never run and namespace-scope objects
# needing dynamic initialization are never constructed.  Qt mostly sidesteps
# this by design - Q_GLOBAL_STATIC is a function-local static with a
# __cxa_guard, initialized on first use - which is one more reason this port
# uses Qt as it stands rather than reaching for global objects.
QMAKE_LFLAGS += -nostartfiles -Wl,-Ttext=100

# ---- the EwokOS flags, straight out of make.rule --------------------------
EWOK_CXXFLAGS = \
    -march=armv8-a \
    -nostdinc++ \
    -fPIC \
    -fno-builtin-memcpy \
    -fno-builtin-memmove \
    -fno-builtin-memset \
    -Wno-unused-parameter \
    -fno-rtti \
    -fno-exceptions \
    -fno-use-cxa-atexit \
    -mstrict-align \
    -mno-outline-atomics \
    -DARCH_BOOST \
    -D__EWOKOS__ \
    -Wno-error \
    -I$$EWOK_SDK/include

EWOK_CFLAGS = \
    -march=armv8-a \
    -fPIC \
    -fno-builtin-memcpy \
    -fno-builtin-memmove \
    -fno-builtin-memset \
    -Wno-unused-parameter \
    -Wno-incompatible-pointer-types \
    -Wno-int-conversion \
    -Wno-implicit-function-declaration \
    -mstrict-align \
    -mno-outline-atomics \
    -DARCH_BOOST \
    -D__EWOKOS__ \
    -Wno-error \
    -I$$EWOK_SDK/include

QMAKE_CFLAGS   += $$EWOK_CFLAGS
QMAKE_CXXFLAGS += $$EWOK_CXXFLAGS
QMAKE_LFLAGS   += -L$$EWOK_SDK/lib

# Pin every standard-level switch to c++14 - see decision 3 above.
QMAKE_CFLAGS_GNUC99      = -std=c99
QMAKE_CFLAGS_GNUC11      = -std=c99
QMAKE_CXXFLAGS_CXX11     = -std=c++14
QMAKE_CXXFLAGS_CXX14     = -std=c++14
QMAKE_CXXFLAGS_CXX1Z     = -std=c++14
QMAKE_CXXFLAGS_CXX2A     = -std=c++14
QMAKE_CXXFLAGS_GNUCXX11  = -std=c++14
QMAKE_CXXFLAGS_GNUCXX14  = -std=c++14
QMAKE_CXXFLAGS_GNUCXX1Z  = -std=c++14
QMAKE_CXXFLAGS_GNUCXX2A  = -std=c++14

# No precompiled headers: they would have to be built with these same flags and
# buy little against a one-off cross build.
QMAKE_PCH_OUTPUT_EXT    = .gch

load(qt_config)
